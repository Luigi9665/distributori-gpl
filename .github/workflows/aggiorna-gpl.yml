name: Pubblica gpl.json

# Il sito MIMIT blocca i server di GitHub, quindi gpl.json viene generato sul PC
# (scripts/aggiorna-e-pubblica.ps1) e caricato in dati/gpl.json.
# Questo workflow lo pubblica su GitHub Pages ad ogni aggiornamento.
on:
  push:
    branches: [main]
    paths:
      - "dati/gpl.json"
      - ".github/workflows/aggiorna-gpl.yml"
  # Permette di avviarlo a mano dal sito GitHub (scheda Actions)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Controlla che gpl.json esista
        run: test -s dati/gpl.json

      - name: Prepara la cartella da pubblicare
        run: |
          mkdir public
          cp dati/gpl.json public/gpl.json

      - name: Prepara Pages
        uses: actions/configure-pages@v5

      - name: Carica la cartella public
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
